<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسرة الشهيد استفانوس</title>
<link rel="icon" id="fav" href="">
<link rel="apple-touch-icon" id="touch" href="">
<link rel="manifest" id="mani" href="">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="استفانوس">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;900&family=Cinzel:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050505;--bg2:#0e0b06;--gold:#d4af37;--soft:#f5e6a8;--text:#f3ecd8;--muted:#9c9278;--card:rgba(255,255,255,.05);--line:rgba(212,175,55,.35);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg) 70%) fixed;color:var(--text);font-family:'Cairo',system-ui,sans-serif;min-height:100vh}
.view{display:none;min-height:100vh;padding:20px 16px 70px}
.view.on{display:block}
#intro.on,#auth.on{display:flex;align-items:center;justify-content:center}
.card{width:min(94%,520px);margin:0 auto;padding:30px 22px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 70px rgba(212,175,55,.1);text-align:center;animation:up .9s both}
.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 40px rgba(212,175,55,.5);animation:pulse 4s ease-in-out infinite}
h1{margin-top:16px;font-size:clamp(28px,7.5vw,46px);font-weight:900;line-height:1.35;background:linear-gradient(110deg,#a8841f 20%,var(--soft) 45%,#a8841f 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
h2{color:var(--gold);font-size:22px;margin-bottom:14px}
.hello{margin-top:14px;color:var(--muted);font-size:18px}
.pill{display:inline-block;margin-top:14px;padding:7px 24px;color:var(--gold);border:1px solid var(--line);border-radius:999px;background:rgba(212,175,55,.07);font-weight:600}
.btn{display:inline-block;padding:13px 34px;font:900 17px 'Cairo',sans-serif;color:#120d02;background:linear-gradient(135deg,var(--soft),var(--gold) 55%,#a8841f);border:0;border-radius:14px;cursor:pointer;box-shadow:0 8px 26px rgba(212,175,55,.3);transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn.sm{padding:8px 18px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none}
.btn.full{width:100%;margin-top:10px}
.credit{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:500 12px 'Cinzel',serif;letter-spacing:4px;text-transform:uppercase;color:var(--muted);pointer-events:none}
.credit b{color:var(--gold);font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;font:600 15px 'Cairo';color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tabs button.on{color:#120d02;background:var(--gold)}
input,select,textarea{width:100%;margin-top:10px;padding:12px 14px;font:400 16px 'Cairo';color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;outline:0;text-align:right}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
label{display:block;margin-top:12px;text-align:right;color:var(--muted);font-size:14px}
.photo{display:flex;align-items:center;gap:12px;margin-top:12px}
.photo img{width:76px;height:76px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#111}
.photo div{display:flex;flex-direction:column;gap:6px;flex:1}
.err{margin-top:12px;color:#ff8a8a;font-size:14px;min-height:20px}
.ok{color:#8fe3a1}
.top{display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto 18px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.top img.av{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.top .info{flex:1;text-align:right}
.top .info b{display:block;font-size:18px}
.top .info span{color:var(--muted);font-size:13px}
.wrap{max-width:820px;margin:0 auto}
.panel{padding:18px;margin-bottom:16px;border:1px solid var(--line);border-radius:20px;background:var(--card);text-align:right}
.verse{font-size:20px;line-height:2;color:var(--soft);text-align:center}
.verse small{display:block;margin-top:6px;color:var(--gold);font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{padding:20px 10px;text-align:center;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.stat b{display:block;font-size:40px;color:var(--gold)}
.stat span{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(212,175,55,.12)}
.row:last-child{border:0}
.row img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);background:#111}
.row .n{flex:1;text-align:right}
.row .n small{display:block;color:var(--muted)}
.row input{width:80px;margin:0;padding:8px}
.pts{font-size:34px;color:var(--gold);font-weight:900}
.note{padding:10px 12px;margin-top:8px;border-radius:12px;background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);text-align:right}
.note small{display:block;color:var(--muted);margin-top:2px}
.note.new{border-color:var(--gold)}
.sub{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.sub button{white-space:nowrap;padding:9px 16px;font:600 14px 'Cairo';color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.sub button.on{color:#120d02;background:var(--gold)}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-220% 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 22px rgba(212,175,55,.35)}50%{box-shadow:0 0 50px rgba(212,175,55,.8)}}

html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
.view{min-height:100dvh}
.row{flex-wrap:wrap}
.row .n{min-width:120px}
.btn.ins{margin-top:12px}
.top .btn.sm{padding:8px 12px}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.on{display:flex}
.modal .card{max-width:440px}
.modal p{line-height:2;color:var(--text);margin-bottom:18px}
@media(max-width:380px){
  .view{padding:14px 10px 70px}
  .card{padding:24px 14px}
  .logo{width:120px;height:120px}
  .btn{padding:11px 22px;font-size:16px}
  .top .info b{font-size:16px}
  .row input{width:64px}
  .stat b{font-size:32px}
}
@media(min-width:700px){
  .view{padding:30px 28px 70px}
  .card{width:min(92%,560px);padding:42px 36px}
  .logo{width:180px;height:180px}
  .top,.wrap{max-width:980px}
  #allList,#ptsList,#attList{display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
  .stat b{font-size:48px}
  .verse{font-size:22px}
}
@media(min-width:1100px){
  .top,.wrap{max-width:1180px}
  #member .wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  #member .wrap .panel{margin:0}
  #member .wrap .panel:last-child{grid-column:1/-1}
  #allList,#ptsList,#attList{grid-template-columns:1fr 1fr 1fr}
  .card{width:min(92%,600px)}
  .panel{padding:24px}
}
@media(display-mode:standalone){
  [data-install]{display:none!important}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<section class="view on" id="intro">
  <div class="card">
    <img class="logo" data-logo alt="">
    <p class="hello">أزيك في تطبيق</p>
    <h1>أسرة الشهيد استفانوس</h1>
    <span class="pill">خدمة إعدادي</span>
    <div style="margin-top:28px"><button class="btn" id="start">يلا نبدأ</button></div>
    <div><button class="btn ghost sm ins" data-install>📲 نزّل التطبيق</button></div>
  </div>
</section>

<section class="view" id="auth">
  <div class="card">
    <img class="logo" style="width:90px;height:90px" data-logo alt="">
    <div class="tabs" style="margin-top:18px">
      <button class="on" data-t="login">تسجيل دخول</button>
      <button data-t="signup">إنشاء حساب</button>
    </div>
    <div id="loginBox">
      <input id="lUser" placeholder="رقم الموبايل أو admin" autocomplete="username">
      <input id="lPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
      <button class="btn full" id="lBtn">دخول</button>
    </div>
    <div id="signupBox" style="display:none">
      <input id="sName" placeholder="الاسم">
      <label>تاريخ الميلاد</label>
      <input id="sBirth" type="date">
      <input id="sPhone" type="tel" placeholder="رقم الموبايل" inputmode="numeric">
      <input id="sPass" type="password" placeholder="كلمة المرور" autocomplete="new-password">
      <div class="photo">
        <img id="sPrev" data-logo alt="">
        <div>
          <button class="btn sm" type="button" id="sCam">📷 صوّر بالكاميرا</button>
          <button class="btn sm ghost" type="button" id="sGal">🖼️ من المعرض</button>
        </div>
      </div>
      <input type="file" id="sCamIn" accept="image/*" capture="user" hidden>
      <input type="file" id="sGalIn" accept="image/*" hidden>
      <button class="btn full" id="sBtn">إنشاء الحساب</button>
    </div>
    <div class="err" id="aErr"></div>
    <button class="btn sm ghost" id="rulesBtn" style="display:none;margin-top:10px">📋 انسخ قواعد Firestore</button>
  </div>
</section>

<section class="view" id="member">
  <div class="top">
    <img class="av" id="mAv" data-logo alt="">
    <div class="info"><b id="mName"></b><span id="mPhone"></span></div>
    <button class="btn sm ghost" data-install title="تنزيل التطبيق">📲</button>
    <button class="btn sm ghost" data-out>خروج</button>
  </div>
  <div class="wrap">
    <div class="panel"><h2>آية اليوم</h2><div class="verse" id="mVerse"></div></div>
    <div class="panel" style="text-align:center"><h2>نقاطي</h2><div class="pts" id="mPts">0</div></div>
    <div class="panel"><h2>الإشعارات</h2><div id="mNotes"></div></div>
  </div>
</section>

<section class="view" id="admin">
  <div class="top">
    <img class="av" data-logo alt="">
    <div class="info"><b>لوحة الخادم</b><span>أسرة الشهيد استفانوس</span></div>
    <button class="btn sm ghost" data-install title="تنزيل التطبيق">📲</button>
    <button class="btn sm ghost" data-out>خروج</button>
  </div>
  <div class="wrap">
    <div class="sub" id="aTabs">
      <button class="on" data-p="pHome">الرئيسية</button>
      <button data-p="pAdd">إضافة مخدوم</button>
      <button data-p="pAtt">الحضور والغياب</button>
      <button data-p="pPts">النقاط</button>
      <button data-p="pVerse">الآية</button>
    </div>

    <div id="pHome" class="pane">
      <div class="stats">
        <div class="stat"><b id="cWeb">0</b><span>مستخدمي الويب</span></div>
        <div class="stat"><b id="cAll">0</b><span>المخدومين</span></div>
      </div>
      <div class="panel"><h2>كل المخدومين</h2><div id="allList"></div></div>
    </div>

    <div id="pAdd" class="pane" style="display:none">
      <div class="panel">
        <h2>إضافة مخدوم</h2>
        <input id="nName" placeholder="الاسم">
        <label>تاريخ الميلاد</label>
        <input id="nBirth" type="date">
        <input id="nPhone" type="tel" placeholder="رقم الموبايل" inputmode="numeric">
        <div class="photo">
          <img id="nPrev" data-logo alt="">
          <div>
            <button class="btn sm" type="button" id="nCam">📷 صوّر بالكاميرا</button>
            <button class="btn sm ghost" type="button" id="nGal">🖼️ من المعرض</button>
          </div>
        </div>
        <input type="file" id="nCamIn" accept="image/*" capture="user" hidden>
        <input type="file" id="nGalIn" accept="image/*" hidden>
        <button class="btn full" id="nBtn">إضافة</button>
        <div class="err" id="nErr"></div>
      </div>
    </div>

    <div id="pAtt" class="pane" style="display:none">
      <div class="panel">
        <h2>الحضور والغياب</h2>
        <select id="attType">
          <option value="mass">حضور القداس</option>
          <option value="sunday">مدارس الأحد</option>
        </select>
        <div id="attList" style="margin-top:10px"></div>
      </div>
    </div>

    <div id="pPts" class="pane" style="display:none">
      <div class="panel"><h2>النقاط</h2><div id="ptsList"></div></div>
    </div>

    <div id="pVerse" class="pane" style="display:none">
      <div class="panel"><h2>آية اليوم</h2><div class="verse" id="aVerse"></div></div>
    </div>
  </div>
</section>

<div class="modal" id="hintBox">
  <div class="card">
    <h2>تنزيل التطبيق</h2>
    <p id="hintTxt"></p>
    <button class="btn" id="hintOk">تمام</button>
  </div>
</div>

const verseOfDay=()=>{
  const d=new Date();
  const n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/864e5);
  const v=VERSES[n%VERSES.length];
  return `«${v[0]}»<small>${v[1]}</small>`;
};

(()=>{
  const img=new Image();
  img.onload=()=>{
    const mk=n=>{
      const c=document.createElement("canvas");
      c.width=c.height=n;
      const k=Math.min(img.width,img.height);
      c.getContext("2d").drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,n,n);
      return c.toDataURL("image/png");
    };
    const i192=mk(192),i512=mk(512);
    document.getElementById("touch").href=mk(180);
    const base=location.href.split("#")[0].split("?")[0];

      name:"أسرة الشهيد استفانوس",

})();

const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isAdmin() {
      return request.auth != null && request.auth.token.email == 'admin@stefanos.app';
    }
    match /users/{uid} {
      allow read: if request.auth != null && (request.auth.uid == uid || isAdmin());
      allow create: if isAdmin() || (request.auth != null && request.auth.uid == uid && request.resource.data.role == 'member' && request.resource.data.points == 0);
      allow update, delete: if isAdmin();
    }
    match /notifications/{id} {
      allow read: if request.auth != null && (resource.data.uid == request.auth.uid || isAdmin());
      allow update: if request.auth != null && resource.data.uid == request.auth.uid && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['read']);
      allow create, update, delete: if isAdmin();
    }
    match /attendance/{id} {
      allow read, write: if isAdmin();
    }
  }
}
`;
$("rulesBtn").onclick=async()=>{
  try{await navigator.clipboard.writeText(RULES)}
  catch{
    const t=document.createElement("textarea");
    t.value=RULES;
    document.body.appendChild(t);
    t.select();
    document.execCommand("copy");
    t.remove();
  }
  $("rulesBtn").textContent="✔ اتنسخت، الصقها في Rules واضغط Publish";
};
new MutationObserver(()=>{

}).observe($("aErr"),{childList:true,characterData:true,subtree:true});

  "auth/configuration-not-found":"افتح Authentication في Firebase واضغط Get started",
  "auth/unauthorized-domain":"ضيف الدومين في Authentication > Settings > Authorized domains",
  "permission-denied":"قواعد Firestore مش متنشرة (Rules ثم Publish)",
  "not-found":"اعمل Firestore Database من لوحة Firebase",
  "failed-precondition":"اعمل Firestore Database من لوحة Firebase",
  "unavailable":"مشكلة في الاتصال بـ Firebase",
  "nodoc":"الحساب ده مالوش بيانات، اعمل حساب جديد"
}[e.code]||("حصل خطأ: "+(e.code||e.message)));

const compress=file=>new Promise((res,rej)=>{
  const r=new FileReader();
  r.onerror=rej;
  r.onload=()=>{
    const img=new Image();
    img.onerror=rej;
    img.onload=()=>{
      const m=320,k=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*k);
      c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.72));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
});

const photos={s:"",n:""};
const bindPhoto=p=>{
  $(p+"Cam").onclick=()=>$(p+"CamIn").click();
  $(p+"Gal").onclick=()=>$(p+"GalIn").click();
  for(const i of ["CamIn","GalIn"]){
    $(p+i).onchange=async e=>{
      const f=e.target.files[0];
      if(!f)return;
      try{photos[p]=await compress(f);$(p+"Prev").src=photos[p]}catch{}
      e.target.value="";
    };
  }
};
bindPhoto("s");
bindPhoto("n");

$("start").onclick=()=>show("auth");

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("loginBox").style.display=b.dataset.t==="login"?"block":"none";
  $("signupBox").style.display=b.dataset.t==="signup"?"block":"none";
  $("aErr").textContent="";
});

$("lBtn").onclick=async()=>{
  $("aErr").textContent="";
  const u=$("lUser").value,p=$("lPass").value;
  if(!u||!p){$("aErr").textContent="اكتب البيانات كلها";return}
  if(NOCONFIG){$("aErr").textContent=NOCFG_MSG;return}
  $("lBtn").disabled=true;
  try{await signInWithEmailAndPassword(auth,toEmail(u),p)}
  catch(e){$("aErr").textContent=errMsg(e)}
  $("lBtn").disabled=false;
};

$("sBtn").onclick=async()=>{
  $("aErr").textContent="";
  if(NOCONFIG){$("aErr").textContent=NOCFG_MSG;return}
  const name=$("sName").value.trim(),birth=$("sBirth").value,phone=$("sPhone").value.replace(/\D/g,""),pass=$("sPass").value;
  if(!name||!birth||phone.length<8||!pass){$("aErr").textContent="كمّل كل البيانات";return}
  $("sBtn").disabled=true;
  busy=true;
  try{
    const cr=await createUserWithEmailAndPassword(auth,phone+DOMAIN,pass);
    try{
      await setDoc(doc(db,"users",cr.user.uid),{name,birth,phone,photo:photos.s,points:0,role:"member",src:"web",createdAt:serverTimestamp()});
    }catch(e){
      try{await cr.user.delete()}catch{}
      throw e;
    }
    busy=false;
    await route(cr.user);
  }catch(e){
    busy=false;
    $("aErr").textContent=errMsg(e);
  }
  $("sBtn").disabled=false;
};

document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>signOut(auth));

onAuthStateChanged(auth,async u=>{
  if(busy)return;
  if(!u){show($("aErr").textContent?"auth":"intro");return}
  try{await route(u)}
  catch(e){
    $("aErr").textContent=errMsg(e);
    show("auth");
    await signOut(auth);
  }
});

const route=async u=>{
  if(u.email===ADMIN_EMAIL){await loadAdmin();show("admin");return}
  const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists())throw {code:"nodoc"};
  await loadMember(u.uid,s.data());
  show("member");
};

const ago=t=>{
  if(!t)return"";
  const d=t.toDate?t.toDate():new Date(t);
  return d.toLocaleString("ar-EG",{dateStyle:"medium",timeStyle:"short"});
};

const loadMember=async(uid,d)=>{
  $("mAv").src=d.photo||LOGO;
  $("mName").textContent=d.name;
  $("mPhone").textContent=d.phone;
  $("mPts").textContent=d.points||0;
  $("mVerse").innerHTML=verseOfDay();
  const q=await getDocs(query(collection(db,"notifications"),where("uid","==",uid)));
  const list=q.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.at?.seconds||0)-(a.at?.seconds||0));
  $("mNotes").innerHTML=list.length?list.map(n=>`<div class="note ${n.read?"":"new"}">${esc(n.text)}<small>${ago(n.at)}</small></div>`).join(""):`<div class="note">مفيش إشعارات لسه</div>`;
  for(const n of list)if(!n.read)updateDoc(doc(db,"notifications",n.id),{read:true}).catch(()=>{});
};

let members=[];
const loadMembers=async()=>{
  const q=await getDocs(collection(db,"users"));
  members=q.docs.map(x=>({id:x.id,...x.data()})).filter(m=>m.role==="member").sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  $("cAll").textContent=members.length;
  $("cWeb").textContent=members.filter(m=>m.src==="web").length;
};

const rowHead=m=>`<img src="${m.photo||LOGO}" alt=""><div class="n">${esc(m.name)}<small>${esc(m.phone)} • ${esc(m.birth)}</small></div>`;

const renderAll=()=>{
  $("allList").innerHTML=members.length?members.map(m=>`<div class="row">${rowHead(m)}</div>`).join(""):`<div class="note">مفيش مخدومين لسه</div>`;
};

const renderPts=()=>{
  $("ptsList").innerHTML=members.length?members.map(m=>`<div class="row">${rowHead(m)}<b style="color:var(--gold)">${m.points||0}</b><input type="number" inputmode="numeric" id="p_${m.id}" placeholder="+"><button class="btn sm" data-pt="${m.id}">إضافة</button></div>`).join(""):`<div class="note">مفيش مخدومين لسه</div>`;
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.pt,v=parseInt($("p_"+id).value,10);
    if(!v)return;
    b.disabled=true;
    try{
      await updateDoc(doc(db,"users",id),{points:increment(v)});
      await addDoc(collection(db,"notifications"),{uid:id,text:`اتضافلك ${v} نقطة ⭐`,at:serverTimestamp(),read:false});
      await loadMembers();
      renderPts();renderAll();
    }catch{b.disabled=false}
  });
};

const TYPES={mass:"حضور القداس",sunday:"مدارس الأحد"};
let present={};
const renderAtt=async()=>{
  const type=$("attType").value;
  const q=await getDocs(query(collection(db,"attendance"),where("date","==",today())));
  present={};
  q.docs.forEach(x=>{const d=x.data();if(d.type===type)present[d.uid]=x.id});
  $("attList").innerHTML=members.length?members.map(m=>{
    const on=!!present[m.id];
    return `<div class="row">${rowHead(m)}<button class="btn sm ${on?"":"ghost"}" data-at="${m.id}">${on?"✔ حاضر":"غايب"}</button></div>`;
  }).join(""):`<div class="note">مفيش مخدومين لسه</div>`;
  document.querySelectorAll("[data-at]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.at,ref=doc(db,"attendance",`${today()}_${type}_${id}`);
    b.disabled=true;
    try{
      if(present[id]){await deleteDoc(ref)}
      else{
        await setDoc(ref,{uid:id,type,date:today(),at:serverTimestamp()});
        await addDoc(collection(db,"notifications"),{uid:id,text:`اتسجلت في ${TYPES[type]} النهارده ✅`,at:serverTimestamp(),read:false});
      }
      await renderAtt();
    }catch{b.disabled=false}
  });
};

$("attType").onchange=renderAtt;

$("nBtn").onclick=async()=>{
  $("nErr").textContent="";$("nErr").className="err";
  const name=$("nName").value.trim(),birth=$("nBirth").value,phone=$("nPhone").value.replace(/\D/g,"");
  if(!name||!birth||phone.length<8){$("nErr").textContent="كمّل كل البيانات";return}
  $("nBtn").disabled=true;
  try{
    const cr=await createUserWithEmailAndPassword(auth2,phone+DOMAIN,phone);
    await setDoc(doc(db,"users",cr.user.uid),{name,birth,phone,photo:photos.n,points:0,role:"member",src:"admin",createdAt:serverTimestamp()});
    await signOut(auth2);
    $("nName").value="";$("nBirth").value="";$("nPhone").value="";
    photos.n="";$("nPrev").data-logo;
    $("nErr").className="err ok";
    $("nErr").textContent="تمت الإضافة (كلمة مرور المخدوم = رقم موبايله)";
    await loadMembers();renderAll();renderPts();
  }catch(e){$("nErr").textContent=errMsg(e)}
  $("nBtn").disabled=false;
};

document.querySelectorAll("#aTabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#aTabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".pane").forEach(p=>p.style.display=p.id===b.dataset.p?"block":"none");
  if(b.dataset.p==="pAtt")renderAtt();
  if(b.dataset.p==="pPts")renderPts();
});

const loadAdmin=async()=>{
  await loadMembers();
  renderAll();
  $("aVerse").innerHTML=verseOfDay();
};
</script>
</body>
